# Stack locale Server (vérité) — embarquée dans l'installeur.
services:
  postgres:
    image: schoolmatrix/postgres:bundle
    container_name: schoolmatrix_postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-schoolmatrix}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-schoolmatrix}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schoolmatrix_pgdata_server:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: schoolmatrix/backend:bundle
    container_name: schoolmatrix_api_server
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      STORAGE_ROOT: /app/storage
      NODE_ID: LOCAL
      GCS_BUCKET: ${GCS_BUCKET:-parallele-schoolmatrix-assets}
      GCS_PREFIX: ${GCS_PREFIX:-schoolmatrix}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-parallele-schoolmatrix}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - schoolmatrix_storage_server:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  sync-agent:
    image: schoolmatrix/sync-agent:bundle
    container_name: schoolmatrix_sync_agent
    restart: unless-stopped
    environment:
      LOCAL_API_URL: http://backend:3000
      REMOTE_API_URL: ${REMOTE_API_URL:-http://34.95.43.132}
      SYNC_API_KEY: ${SYNC_API_KEY}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-45000}
      SYNC_NODE_ID: ${SYNC_NODE_ID:-local-mother}
    depends_on:
      - backend

volumes:
  schoolmatrix_pgdata_server:
  schoolmatrix_storage_server:
